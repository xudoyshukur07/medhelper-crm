<head>
    <meta charset="UTF-8">

    <title>📋 Elektron Shablonlar - MedHelper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: "Segoe UI", sans-serif; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000;
            display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8);
        }
        .login-box { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 350px; }
        .login-box h2 { color: #764ba2; margin-bottom: 15px; }
        .login-box input { width: 100%; padding: 14px; font-size: 18px; text-align: center; letter-spacing: 5px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 15px; }
        .login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .error-msg { color: red; margin-top: 10px; min-height: 30px; }
        
        .main-app { display: none; }
        .navbar {
            background: white; padding: 15px 25px; border-radius: 20px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;
        }
        .logo { font-size: 22px; font-weight: bold; color: #764ba2; }
        .doctor-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .doctor-info .name { font-weight: bold; color: #333; }
        .doctor-info .phone { color: #666; font-size: 14px; }
        .doctor-info .region { color: #666; font-size: 14px; }
        .logout-btn { padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .profile-btn { padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 10px; cursor: pointer; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card {
            background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s; border: 2px solid transparent;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .product-card.selected { border-color: #28a745; background: #f0fff4; }
        .product-card .name { font-size: 16px; font-weight: bold; color: #764ba2; margin-bottom: 6px; }
        .product-card .info { font-size: 12px; color: #888; margin-bottom: 4px; }
        .product-card .actions { display: flex; gap: 8px; margin-top: 12px; }
        .product-card .actions button { flex: 1; padding: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-print { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-add { background: #28a745; color: white; width: 40px; }
        .btn-add.active { background: #dc3545; }
        .product-card .badge { position: absolute; top: -8px; right: -8px; background: #28a745; color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { color: #764ba2; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 5px; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; }
        .modal-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        .doctor-list-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .doctor-list-item:hover { background: #f0f0f0; }
        .doctor-list-item.selected { background: #d4edda; border-left: 3px solid #28a745; }
        .doctor-list-item .info { flex: 1; }
        .doctor-list-item .name { font-weight: bold; }
        .doctor-list-item .speciality { font-size: 12px; color: #888; }
        
        .selected-products-list { max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-bottom: 15px; }
        .selected-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
        .selected-item .remove { color: #dc3545; cursor: pointer; font-weight: bold; }
        
        .toast { position: fixed; bottom: 30px; right: 30px; background: #28a745; color: white; padding: 12px 20px; border-radius: 10px; z-index: 1100; animation: slideIn 0.3s ease; }
        .toast.error { background: #dc3545; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        @media (max-width: 768px) { .products-grid { grid-template-columns: 1fr; } }
    </style>
</head>

                <div class="form-group">

                </div>

                    <label>🏙️ Tuman</label>

                </div>
                <div id="doctorList" style="max-height:200px; overflow-y:auto; border:1px solid #ddd; border-radius:10px; padding:10px;">

        // ============ LOGIN ============
        document.getElementById("loginBtn").onclick = function() {
            const password = document.getElementById("loginPassword").value;
            if (password === UNIVERSAL_PASSWORD) {
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
                loadDoctors();
                checkAutoLogin();
            } else {
                document.getElementById("loginError").textContent = "❌ Parol noto'g'ri!";
                document.getElementById("loginPassword").value = "";
            }
        };

        document.getElementById("loginPassword").addEventListener("keypress", function(e) {
            if (e.key === "Enter") document.getElementById("loginBtn").click();
        });

        // ============ LOAD DOCTORS ============
        async function loadDoctors() {
            try {
                const snapshot = await db.collection("doctors").where("isActive", "==", true).get();
                allDoctors = [];
                snapshot.forEach(doc => {
                    allDoctors.push({ id: doc.id, ...doc.data() });
                });
                console.log("✅ Doctors loaded:", allDoctors.length);
                
                const savedDoctorId = localStorage.getItem("doctor_id");
                if (savedDoctorId) {
                    const found = allDoctors.find(d => d.id === savedDoctorId);
                    if (found) {
                        doctor = found;
                        updateDoctorDisplay();
                        loadData();
                        return;
                    }
                }
                setTimeout(() => document.getElementById("profileBtn").click(), 500);
            } catch (error) {
                console.error("Doctors load error:", error);
            }
        }

        // ============ LOAD DATA ============
        async function loadData() {
            await loadProducts();
            await loadTemplates();
        }

        async function loadProducts() {
            try {
                const q = db.collection("products").where("isActive", "==", true);
                const snapshot = await q.get();
                products = [];
                snapshot.forEach(doc => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                renderProducts();
            } catch (error) {
                console.error("Products load error:", error);
            }
        }

        async function loadTemplates() {
            if (!doctor || !doctor.speciality) return;
            try {
                const q = db.collection("templates")
                    .where("specialities", "array-contains", doctor.speciality)
                    .where("isActive", "==", true);
                const snapshot = await q.get();
                templates = [];
                snapshot.forEach(doc => {
                    templates.push({ id: doc.id, ...doc.data() });
                });
                renderProducts();
            } catch (error) {
                console.error("Templates load error:", error);
            }
        }

        // ============ RENDER PRODUCTS ============
        function renderProducts() {
            const grid = document.getElementById("productsGrid");
            
            const templateProductIds = new Set();
            templates.forEach(t => {
                t.productIds?.forEach(id => templateProductIds.add(id));
            });
            const visibleProducts = products.filter(p => templateProductIds.has(p.id));

            if (visibleProducts.length === 0) {
                grid.innerHTML = "<div style='grid-column:1/-1; text-align:center; padding:40px; background:white; border-radius:20px; color:#999;'>📭 Sizga mos preparatlar mavjud emas</div>";
                return;
            }

            grid.innerHTML = "";
            visibleProducts.forEach(p => {
                const isSelected = selectedProducts.some(sp => sp.id === p.id);
                const card = document.createElement("div");
                card.className = "product-card" + (isSelected ? " selected" : "");
                card.innerHTML = 
                    <div class="name">💊 </div>
                    <div class="info"> </div>
                    <div class="info">⚡  | 🕐 </div>
                    
                    <div class="actions">
                        <button class="btn-print" onclick="printSingle('')">🖨️ Chop etish</button>
                        <button class="btn-add " onclick="toggleSelect('')">
                            
                        </button>
                    </div>
                ;
                grid.appendChild(card);
            });
        }

        // ============ TOGGLE SELECT ============
        function toggleSelect(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const index = selectedProducts.findIndex(p => p.id === productId);
            if (index > -1) {
                selectedProducts.splice(index, 1);
            } else {
                selectedProducts.push(product);
            }
            renderProducts();
        }

        // ============ PRINT SINGLE ============
        function printSingle(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            selectedProducts = [product];
            showPrintModal();
        }

        // ============ SHOW PRINT MODAL ============
        function showPrintModal() {
            if (selectedProducts.length === 0) {
                showToast("Hech qanday preparat tanlanmagan!", true);
                return;
            }
            
            document.getElementById("printModal").style.display = "flex";
            document.getElementById("printCount").textContent = selectedProducts.length;
            
            const list = document.getElementById("printProductList");
            list.innerHTML = selectedProducts.map((p, i) => 
                <div class="selected-item">
                    <span>. </span>
                    <span class="remove" onclick="removeFromSelected('')">✖</span>
                </div>
            ).join("");
            
            document.getElementById("patientName").value = "";
            document.getElementById("patientPhone").value = "";
            document.getElementById("patientAge").value = "";
        }

        function removeFromSelected(productId) {
            selectedProducts = selectedProducts.filter(p => p.id !== productId);
            if (selectedProducts.length === 0) {
                document.getElementById("printModal").style.display = "none";
            } else {
                showPrintModal();
            }
            renderProducts();
        }

        // ============ CONFIRM PRINT ============
        async function confirmPrint() {
            if (selectedProducts.length === 0) {
                showToast("Hech qanday preparat tanlanmagan!", true);
                return;
            }

            const patientName = document.getElementById("patientName").value.trim();
            const patientPhone = document.getElementById("patientPhone").value.trim();
            const patientAge = document.getElementById("patientAge").value.trim();

            const now = new Date();
            const receiptNumber = "RX" + now.getFullYear() + 
                String(now.getMonth()+1).padStart(2,"0") + 
                String(now.getDate()).padStart(2,"0") + 
                String(now.getHours()).padStart(2,"0") + 
                String(now.getMinutes()).padStart(2,"0") + 
                String(now.getSeconds()).padStart(2,"0");

            try {
                for (const product of selectedProducts) {
                    await db.collection("prescriptions").add({
                        doctorId: doctor.id,
                        doctorName: doctor.name,
                        doctorPhone: doctor.phone,
                        doctorSpeciality: doctor.speciality,
                        patientName: patientName,
                        patientPhone: patientPhone,
                        patientAge: patientAge,
                        drugName: product.name,
                        drugTarkibi: product.tarkibi || "",
                        drugDoza: product.doza || "",
                        drugMiqdori: product.miqdori || "",
                        drugQabul: product.qabul || "",
                        drugIzoh: product.izoh || "",
                        drugQollanishi: product.qollanishi || "",
                        drugBarcode: product.barcode || "",
                        receiptNumber: receiptNumber,
                        printedAt: new Date(),
                        status: "active",
                        isPrinted: true,
                        printCount: 1,
                        source: "electron-shablonlar",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                const printWindow = window.open("", "_blank", "width=450,height=700");
                if (printWindow) {
                    const html = getReceiptHTML(selectedProducts, receiptNumber, patientName);
                    printWindow.document.write(html);
                    printWindow.document.close();
                    setTimeout(() => printWindow.print(), 500);
                }

                document.getElementById("printModal").style.display = "none";
                selectedProducts = [];
                showToast("✅ Retsept chop etildi va saqlandi!");
                renderProducts();
            } catch (error) {
                console.error("Print error:", error);
                showToast("❌ Xatolik: " + error.message, true);
            }
        }

        // ============ UPDATE DISPLAY ============
        function updateDoctorDisplay() {
            if (doctor) {
                document.getElementById("doctorName").textContent = doctor.name || "Vrach";
                document.getElementById("doctorPhone").textContent = doctor.phone || "";
                document.getElementById("doctorRegion").textContent = doctor.region || "";
            }
        }

        // ============ PROFILE ============
        document.getElementById("profileBtn").onclick = function() {
            document.getElementById("profileModal").style.display = "flex";
            document.getElementById("profileStep1").style.display = "block";
            document.getElementById("profileStep2").style.display = "none";
            document.getElementById("profilePassword").value = "";
            populateRegions();
        };

        document.getElementById("closeProfileBtn").onclick = function() {
            document.getElementById("profileModal").style.display = "none";
        };

        document.getElementById("profilePasswordBtn").onclick = function() {
            const pass = document.getElementById("profilePassword").value;
            if (pass === CHANGE_PASSWORD) {
                document.getElementById("profileStep1").style.display = "none";
                document.getElementById("profileStep2").style.display = "block";
                populateDoctors();
            } else {
                showToast("❌ Parol noto'g'ri!", true);
            }
        };

        function populateRegions() {
            const select = document.getElementById("editDoctorRegion");
            select.innerHTML = "<option value=\"\">-- Tanlang --</option>";
            Object.keys(regionDistricts).forEach(r => {
                const opt = document.createElement("option");
                opt.value = r;
                opt.textContent = r;
                select.appendChild(opt);
            });
            select.onchange = function() {
                const districtSelect = document.getElementById("editDoctorDistrict");
                districtSelect.innerHTML = "<option value=\"\">-- Tanlang --</option>";
                const districts = regionDistricts[this.value] || [];
                districts.forEach(d => {
                    const opt = document.createElement("option");
                    opt.value = d;
                    opt.textContent = d;
                    districtSelect.appendChild(opt);
                });
                populateDoctors();
            };
            document.getElementById("editDoctorDistrict").onchange = function() {
                populateDoctors();
            };
        }

        function populateDoctors() {
            const region = document.getElementById("editDoctorRegion").value;
            const district = document.getElementById("editDoctorDistrict").value;
            const list = document.getElementById("doctorList");
            
            if (!region || !district) {
                list.innerHTML = "<div style=\"padding:15px; text-align:center; color:#999;\">Viloyat va tumanni tanlang</div>";
                return;
            }

            const filtered = allDoctors.filter(d => d.region === region && d.district === district && d.isActive);
            
            if (filtered.length === 0) {
                list.innerHTML = "<div style=\"padding:15px; text-align:center; color:#999;\">Bu hududda faol vrachlar mavjud emas</div>";
                return;
            }

            list.innerHTML = "";
            filtered.forEach(d => {
                const div = document.createElement("div");
                div.className = "doctor-list-item" + (selectedDoctorId === d.id ? " selected" : "");
                div.innerHTML = 
                    <div class="info">
                        <div class="name"></div>
                        <div class="speciality"> | 📞 </div>
                    </div>
                    <span style="font-size:20px;"></span>
                ;
                div.onclick = function() {
                    selectedDoctorId = d.id;
                    populateDoctors();
                };
                list.appendChild(div);
            });
        }

        document.getElementById("saveDoctorBtn").onclick = async function() {
            if (!selectedDoctorId) {
                showToast("❌ Iltimos, vrachni tanlang!", true);
                return;
            }

            try {
                const selected = allDoctors.find(d => d.id === selectedDoctorId);
                if (!selected) {
                    showToast("❌ Vrach topilmadi!", true);
                    return;
                }

                doctor = selected;
                localStorage.setItem("doctor_id", doctor.id);
                localStorage.setItem("doctor_name", doctor.name);
                localStorage.setItem("doctor_phone", doctor.phone);
                localStorage.setItem("doctor_region", doctor.region);
                localStorage.setItem("doctor_district", doctor.district);
                localStorage.setItem("doctor_speciality", doctor.speciality);
                localStorage.setItem("auto_login", "true");

                updateDoctorDisplay();
                document.getElementById("profileModal").style.display = "none";
                showToast("✅ Vrach tanlandi!");
                loadData();
            } catch (error) {
                showToast("❌ Xatolik: " + error.message, true);
            }
        };

        // ============ LOGOUT ============
        document.getElementById("logoutBtn").onclick = function() {
            localStorage.clear();
            document.getElementById("loginOverlay").style.display = "flex";
            document.getElementById("mainApp").style.display = "none";
            document.getElementById("loginPassword").value = "";
        };

        // ============ TOAST ============
        function showToast(msg, isError = false) {
            const toast = document.createElement("div");
            toast.className = "toast" + (isError ? " error" : "");
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ============ AUTO LOGIN ============
        function checkAutoLogin() {
            const savedDoctorId = localStorage.getItem("doctor_id");
            const savedDeviceId = localStorage.getItem("deviceId");
            const savedAutoLogin = localStorage.getItem("auto_login");
            
            if (savedAutoLogin === "true" && savedDoctorId && savedDeviceId) {
                const found = allDoctors.find(d => d.id === savedDoctorId);
                if (found) {
                    doctor = found;
                    updateDoctorDisplay();
                    loadData();
                }
            }
        }

        // ============ CLOSE MODALS ============
        document.getElementById("closePrintModal").onclick = function() {
            document.getElementById("printModal").style.display = "none";
        };

        document.getElementById("confirmPrintBtn").onclick = confirmPrint;

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                document.querySelectorAll(".modal").forEach(m => m.style.display = "none");
            }
        });

        console.log("📋 Elektron Shablonlar App v1.0");
    </script>
</body>
</html>
